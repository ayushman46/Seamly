<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0333f" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e0333f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset="0.5" stop-color="#dc2f3c"/>
      <stop offset="1" stop-color="#7c0f1e"/>
    </radialGradient>
    <clipPath id="ballClip"><circle cx="16" cy="16" r="15"/></clipPath>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7efdf"/>
      <stop offset="0.6" stop-color="#b6f5d9"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <g id="mark">
      <circle cx="16" cy="16" r="15" fill="url(#ball)"/>
      <g clip-path="url(#ballClip)">
        <path d="M12.6 1.9C5.8 11 26.2 20.6 19.4 30.1" fill="none" stroke="#fbefd8" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M9.4 3.3C3.4 12.4 22.6 20.8 15.6 30.6" fill="none" stroke="#fbefd8" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.1 2.3"/>
        <path d="M16.2 1.5C10 10.6 29.4 19.4 22.6 28.9" fill="none" stroke="#fbefd8" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.1 2.3"/>
      </g>
      <ellipse cx="10.5" cy="9" rx="4.2" ry="2.6" transform="rotate(-35 10.5 9)" fill="#fff" opacity="0.08"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="#070a12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="990" cy="300" r="420" fill="url(#glowR)"/>
  <circle cx="80" cy="640" r="420" fill="url(#glowG)"/>

  <!-- the big ball -->
  <use href="#mark" transform="translate(838 72) scale(15.5)"/>

  <!-- wordmark -->
  <use href="#mark" transform="translate(84 92) scale(2.6)"/>
  <text x="182" y="150" font-family="Bricolage Grotesque, Inter, system-ui, sans-serif" font-weight="800" font-size="72" letter-spacing="-2.5" fill="#eef2f8">Seamly</text>

  <text x="84" y="300" font-family="Bricolage Grotesque, Inter, system-ui, sans-serif" font-weight="800" font-size="84" letter-spacing="-3.5" fill="#eef2f8">Your pocket</text>
  <text x="84" y="388" font-family="Bricolage Grotesque, Inter, system-ui, sans-serif" font-weight="800" font-size="84" letter-spacing="-3.5" fill="url(#tag)">bowling coach.</text>

  <text x="84" y="462" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="25" fill="#b0bacb">Film one delivery. Get the key moments, measured angles,</text>
  <text x="84" y="500" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="25" fill="#b0bacb">a 3D body model and a two-week practice plan.</text>

  <g font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20">
    <rect x="84" y="540" width="92" height="44" rx="22" fill="#3ddc97"/>
    <text x="130" y="569" text-anchor="middle" fill="#03261a">Free</text>
    <rect x="190" y="540" width="164" height="44" rx="22" fill="#0e1421" stroke="#263147"/>
    <text x="272" y="569" text-anchor="middle" fill="#eef2f8">No account</text>
    <rect x="368" y="540" width="330" height="44" rx="22" fill="#0e1421" stroke="#263147"/>
    <text x="533" y="569" text-anchor="middle" fill="#eef2f8">Your video stays on your device</text>
  </g>
</svg>
